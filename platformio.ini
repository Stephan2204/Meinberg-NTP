[env:wt32-eth01]
platform = espressif32
board = esp32dev
framework = espidf

monitor_speed = 115200
upload_speed = 460800
board_build.partitions = partitions.csv

; Create release/<version>-ota.bin and release/<version>-factory.bin
extra_scripts = post:scripts/create_release_bins.py

; Arduino-ESP32 3.x pulls esp_insights / esp_rainmaker as managed components.
; PlatformIO needs the certificate files explicitly listed so it generates
; the corresponding *.S objects.
board_build.embed_txtfiles =
    managed_components/espressif__esp_insights/server_certs/https_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_mqtt_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_claim_service_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_ota_server.crt
